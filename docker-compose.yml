services:
  # Broker de mensagens para o Celery (spec §4 — async processing).
  # Porta NÃO exposta ao host por padrão — só na rede interna do compose
  # (auditoria §6.6). Para expor (só se necessário), adicione `ports:`.
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  # Banco compartilhado para modo organização (spec §1 — escala; optional).
  # Sem senha padrão: POSTGRES_PASSWORD é obrigatório no ambiente do host.
  # Porta NÃO exposta ao host por padrão.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD (sem senha padrão)}
      POSTGRES_DB: ${POSTGRES_DB:-brain}
    volumes:
      - pg-data:/var/lib/postgresql/data

  # Worker Celery — processa learn/sync assíncronos.
  # Roda como usuário não-root (auditoria §6.7).
  worker:
    build: .
    command: brain-worker
    user: "10001:10001"
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-brain}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-brain}}
    depends_on:
      - redis
      - postgres
    volumes:
      # Monte aqui os arquivos a serem ingeridos (passe /ingest/<arquivo> no learn).
      # O worker roda não-root: garanta leitura no mount (ex.: chmod a+rX).
      - ./ingest:/ingest

volumes:
  redis-data:
  pg-data:
