[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "brain-tool"
version = "1.1.0"
description = "CLI evolutive para gerenciar brains do ecossistema Granjimmy"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Vitor Luiz", email = "vitorluizmachado@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
brain-tool = "brain_tool.cli:main"
brain-tool-legacy = "brain_tool.brain_tool:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["brain_tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
