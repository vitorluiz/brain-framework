[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-framework"
version = "1.1.0"
description = "Framework de gestão de conhecimento (brain.db) para experts do Hermes Agent"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Vitor Luiz", email = "vitorluizmachado@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "celery>=5.3",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
learn = ["pypdf>=4.0", "python-docx>=1.0", "pandas>=2.0", "openpyxl>=3.1"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
brain = "brain_tool.brain:main"
brain-tool = "brain_tool.brain_tool:main"
brain-worker = "brain_tool.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["brain_tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
